trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - script: pip install pyyaml
    displayName: Install dependencies

  - script: |
      git clone --depth 1 https://github.com/mohamedelghazali/TSAR.git .tsar
      python .tsar/scripts/lint_rules.py
    displayName: Lint TSAR rules

  - script: python .tsar/skills/secret-scanner/scanner.py .
    displayName: Secret scan

  - script: python .tsar/skills/secure-review/review.py .
    displayName: Secure review

  - script: python .tsar/skills/crypto-inventory/inventory.py . > cbom.json || true
    displayName: Crypto inventory

  - publish: cbom.json
    artifact: cbom
    displayName: Publish CBOM
