pipelines:
  default:
    - step:
        name: TSAR Security Scan
        image: python:3.12
        script:
          - pip install pyyaml
          - git clone --depth 1 https://github.com/mohamedelghazali/TSAR.git .tsar
          - python .tsar/scripts/lint_rules.py
          - python .tsar/skills/secret-scanner/scanner.py .
          - python .tsar/skills/secure-review/review.py .
          - python .tsar/skills/crypto-inventory/inventory.py . > cbom.json || true
        artifacts:
          - cbom.json
