[project]
name = "tsar-cli"
version = "1.2.0"
description = "TSAR security CLI"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0.0", "cryptography>=42.0.0"]

[project.scripts]
tsar = "tsar:main"

[tool.setuptools]
py-modules = ["tsar", "sarif", "verify_upstream", "lifecycle_engine", "lifecycle_orchestrator", "lifecycle_evidence", "lifecycle_anchor"]
