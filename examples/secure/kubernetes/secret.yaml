apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tsar-app-secrets
  namespace: tsar-example
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tsar-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tsar/app/database_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: tsar/app/jwt_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tsar-app-tls
  namespace: tsar-example
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tsar-app-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: tsar/app/tls_crt
    - secretKey: tls.key
      remoteRef:
        key: tsar/app/tls_key
