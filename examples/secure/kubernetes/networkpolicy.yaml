apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tsar-example
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsar-app-allow
  namespace: tsar-example
spec:
  podSelector:
    matchLabels:
      app: tsar-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Match the Terraform private_subnet_cidrs defaults; update these CIDRs
    # together with variables.tf when the example VPC layout changes.
    - to:
        - ipBlock:
            cidr: 10.40.1.0/24
        - ipBlock:
            cidr: 10.40.2.0/24
      ports:
        - protocol: TCP
          port: 5432
