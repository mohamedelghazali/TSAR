server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/tls/fullchain.pem;
    ssl_certificate_key /etc/tls/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    set $csp_nonce $request_id;

    add_header Content-Security-Policy "
        default-src 'none';
        script-src 'nonce-$csp_nonce' 'strict-dynamic';
        style-src 'nonce-$csp_nonce';
        img-src 'self' data: https://cdn.example.com;
        font-src 'self';
        connect-src 'self' https://api.example.com;
        frame-ancestors 'none';
        base-uri 'none';
        object-src 'none';
        form-action 'self';
        upgrade-insecure-requests;
        report-to csp-endpoint;
    " always;

    add_header Reporting-Endpoints 'csp-endpoint="https://report.example.com/csp"' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://api.example.com/;
        proxy_ssl_verify on;
        proxy_set_header Host api.example.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|woff2|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
