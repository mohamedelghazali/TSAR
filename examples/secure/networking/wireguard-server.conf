[Interface]
Address = 10.100.0.1/24
ListenPort = 51820
PrivateKey = {{ vault://secret/wireguard/server_key }}
MTU = 1420

# TLS via stunnel not required; WireGuard is ChaCha20-Poly1305 + Curve25519.

[Peer]
# peer: mobile-user-1
PublicKey = {{ vault://secret/wireguard/mobile_user_1_pub }}
PresharedKey = {{ vault://secret/wireguard/mobile_user_1_psk }}
AllowedIPs = 10.100.0.10/32
PersistentKeepalive = 25

[Peer]
# peer: laptop-alice
PublicKey = {{ vault://secret/wireguard/laptop_alice_pub }}
PresharedKey = {{ vault://secret/wireguard/laptop_alice_psk }}
AllowedIPs = 10.100.0.11/32
