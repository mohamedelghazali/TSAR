name: Backup, DR, Legal Hold Rules

on:
  push:
    paths:
      - 'rules/backup/**'
      - 'rules/disaster-recovery/**'
      - 'rules/legal-hold/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_backup_rules.py tests/test_dr_rules.py tests/test_legal_hold_rules.py tests/test_backup_examples.py tests/test_cli_extensions.py -v