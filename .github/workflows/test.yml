name: TSAR Self-Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-compatibility:
    name: "Agent Compatibility Inventory"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate all 15 agent prompt integrations
        run: python -m unittest discover -s tests -p test_agent_compatibility.py -v

  test:
    name: "TSAR Self-Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and inspect the published CLI wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tsar-cli-wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/tsar-cli-wheel" ./tools/tsar-cli
          python - "$RUNNER_TEMP/tsar-cli-wheel" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheels = list(Path(sys.argv[1]).glob("tsar_cli-*.whl"))
          assert len(wheels) == 1, f"expected one CLI wheel, found {len(wheels)}"
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              required = {"lifecycle_anchor.py", "lifecycle_evidence.py", "reference_host.py", "claude_code_hook.py", "tsar.py"}
              missing = required - names
              assert not missing, f"wheel is missing required files: {sorted(missing)}"
              entry_point_files = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert len(entry_point_files) == 1, f"expected one entry_points.txt, found {entry_point_files}"
              entry_points = wheel.read(entry_point_files[0]).decode()
              assert "tsar = tsar:main" in entry_points
              assert "tsar-claude-hook = claude_code_hook:main" in entry_points
          print("CLI wheel contains lifecycle, reference-host, Claude Code hook modules, and both CLI entry points.")
          PY

      - name: Install checksum-verified OPA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo opa https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64_static
          echo "791790254c598a942eb140959bcec9a47f844535a632fd01d11d870ba2a47047  opa" | sha256sum --check
          chmod +x opa
          sudo install -m 0755 opa /usr/local/bin/opa
          opa version

      - name: Compile OPA policies
        run: opa check policies/

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Run test suite
        run: pytest -q

      - name: Scan own examples
        run: |
          python skills/secret-scanner/scanner.py examples/secure
          python skills/secure-review/review.py examples/secure

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Validate Terraform example
        run: |
          terraform -chdir=examples/secure/terraform init -backend=false
          terraform -chdir=examples/secure/terraform validate

  claude-code-windows:
    name: "Claude Code Windows Hook Compatibility"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies and TSAR CLI
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .\tools\tsar-cli

      - name: Validate Claude Code hook settings
        shell: pwsh
        run: |
          $settings = Get-Content integrations/claude-code/settings.json -Raw | ConvertFrom-Json
          foreach ($eventName in @("UserPromptSubmit", "PreToolUse")) {
            $handler = $settings.hooks.$eventName[0].hooks[0]
            if ($handler.command -ne "python") { throw "$eventName must invoke the Python executable directly" }
            if (($handler.args -join " ") -ne "-m claude_code_hook") { throw "$eventName has an invalid hook argument vector" }
            if ($handler.onFailure -ne "block") { throw "$eventName must fail closed" }
          }
          if ($settings.hooks.PostToolUse[0].hooks[0].command -ne "python") { throw "PostToolUse hook command mismatch" }
          if ($settings.hooks.PostToolUseFailure[0].hooks[0].command -ne "python") { throw "PostToolUseFailure hook command mismatch" }
          Write-Host "Windows hook settings are valid for exec-form invocation."

      - name: Verify Windows stdin, stdout, exit-code, and deny behavior
        shell: pwsh
        run: |
          $env:CLAUDE_CODE_DISABLE_FILE_MENTIONS = "1"
          $payload = @{
            hook_event_name = "PreToolUse"
            session_id = "windows-smoke"
            cwd = $env:RUNNER_TEMP
            tool_name = "Bash"
            tool_use_id = "windows-smoke"
            tool_input = @{ command = "whoami" }
          } | ConvertTo-Json -Compress -Depth 5
          $output = $payload | python -m claude_code_hook 2>$null
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 2) { throw "Expected fail-closed exit code 2, received $exitCode" }
          $decision = ($output | ConvertFrom-Json).hookSpecificOutput.permissionDecision
          if ($decision -ne "deny") { throw "Expected a structured deny decision, received '$decision'" }
          Write-Host "Windows hook process returned the expected fail-closed decision."
          $global:LASTEXITCODE = 0

      - name: Run Claude Code adapter tests on Windows
        run: python -m pytest -q tests/test_claude_code_hook.py tests/test_tool_boundary.py
