name: TSAR Self-Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Run test suite
        run: pytest -q

      - name: Scan own examples
        run: |
          python skills/secret-scanner/scanner.py examples/secure
          python skills/secure-review/review.py examples/secure

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 # v3

      - name: Validate Terraform example
        run: |
          terraform -chdir=examples/secure/terraform init -backend=false
          terraform -chdir=examples/secure/terraform validate
