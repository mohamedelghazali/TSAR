name: TSAR Self-Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Run test suite
        run: pytest -q

      - name: Scan own examples
        run: |
          python skills/secret-scanner/scanner.py examples/secure
          python skills/secure-review/review.py examples/secure

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Validate Terraform example
        run: |
          terraform -chdir=examples/secure/terraform init -backend=false
          terraform -chdir=examples/secure/terraform validate
