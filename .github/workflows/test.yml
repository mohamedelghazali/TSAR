name: TSAR Self-Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Run test suite
        run: pytest -q

      - name: Scan own examples
        run: |
          python skills/secret-scanner/scanner.py examples/secure
          python skills/secure-review/review.py examples/secure

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba

      - name: Validate Terraform example
        run: |
          terraform -chdir=examples/secure/terraform init -backend=false
          terraform -chdir=examples/secure/terraform validate
