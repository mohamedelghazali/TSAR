name: Policy Check

on:
  push:
    paths:
      - 'policies/**'
  pull_request:
    paths:
      - 'policies/**'

permissions:
  contents: read

jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Install OPA
        run: |
          set -euo pipefail
          curl -fsSLo opa https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64_static
          echo "791790254c598a942eb140959bcec9a47f844535a632fd01d11d870ba2a47047  opa" | sha256sum --check
          chmod +x opa
          sudo install -m 0755 opa /usr/local/bin/opa
      - name: Check policies compile
        run: opa check policies/
      - name: Run policy tests
        run: |
          pip install pytest
          pytest tests/test_policies.py -v
