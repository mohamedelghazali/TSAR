name: Policy Check

on:
  push:
    paths:
      - 'policies/**'
  pull_request:
    paths:
      - 'policies/**'

permissions:
  contents: read

jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install OPA
        run: |
          set -euo pipefail
          OPA_VERSION="v1.22.0"
          OPA_BINARY="opa_linux_amd64"
          OPA_URL="https://github.com/open-policy-agent/opa/releases/download/$OPA_VERSION"
          curl -fsSLo "$OPA_BINARY" "$OPA_URL/$OPA_BINARY"
          curl -fsSLo "$OPA_BINARY.sha256" "$OPA_URL/$OPA_BINARY.sha256"
          sha256sum -c "$OPA_BINARY.sha256"
          chmod 0755 "$OPA_BINARY"
          sudo install -m 0755 "$OPA_BINARY" /usr/local/bin/opa
      - name: Check policies compile
        run: opa check policies/
      - name: Run policy tests
        run: |
          pip install pytest
          pytest tests/test_policies.py -v
