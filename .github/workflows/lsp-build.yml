name: Build TSAR LSP

on:
  push:
    paths:
      - 'tools/tsar-lsp/**'
  pull_request:
    paths:
      - 'tools/tsar-lsp/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # v4
        with:
          node-version: '20'
      - run: cd tools/tsar-lsp && npm install && npm run build
