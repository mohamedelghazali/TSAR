name: Messaging and DB Rules

on:
  push:
    paths:
      - 'rules/messaging/**'
      - 'rules/database/**'
      - 'rules/observability/**'
      - 'rules/secrets/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_messaging_rules.py tests/test_database_rules.py tests/test_observability_rules.py tests/test_secrets_rules.py tests/test_db_examples.py -v
