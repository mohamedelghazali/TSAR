name: Messaging and DB Rules

on:
  push:
    paths:
      - 'rules/messaging/**'
      - 'rules/database/**'
      - 'rules/observability/**'
      - 'rules/secrets/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_messaging_rules.py tests/test_database_rules.py tests/test_observability_rules.py tests/test_secrets_rules.py tests/test_db_examples.py -v
