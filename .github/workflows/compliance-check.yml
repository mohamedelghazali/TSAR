name: Compliance Reference Check

on:
  push:
    paths:
      - 'docs/compliance/**'
      - 'rules/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_compliance_docs.py -v
