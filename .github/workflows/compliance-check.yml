name: Compliance Reference Check

on:
  push:
    paths:
      - 'docs/compliance/**'
      - 'rules/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_compliance_docs.py -v
