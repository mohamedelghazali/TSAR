name: TSAR Enforce on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint TSAR rules
        run: python scripts/lint_rules.py

      - name: Secret scan (full repo)
        run: python skills/secret-scanner/scanner.py .

      - name: Secure review (full repo)
        run: python skills/secure-review/review.py .

      - name: Crypto inventory (report only)
        run: python skills/crypto-inventory/inventory.py . > cbom.json || true

      - name: Upload CBOM
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469
        with:
          name: cbom
          path: cbom.json
