name: TSAR Enforce on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint TSAR rules
        run: python scripts/lint_rules.py

      - name: Secret scan (full repo)
        run: python skills/secret-scanner/scanner.py .

      - name: Secure review (secure examples)
        run: python skills/secure-review/review.py examples/secure

      - name: Crypto inventory (report only)
        run: python skills/crypto-inventory/inventory.py . > cbom.json || true

      - name: Upload CBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # v4
        with:
          name: cbom
          path: cbom.json
