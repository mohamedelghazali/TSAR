name: TSAR Auto-Update Rules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Test synchronization safety
        run: python -m pytest tests/test_sync_standards.py -q

      - name: Sync upstream standards
        run: python scripts/sync_standards.py

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Detect actual changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain --untracked-files=all -- .tsar-cache manifest.yaml)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream fingerprint changes; no version bump or PR required."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream fingerprints changed; preparing review PR."
          fi

      - name: Bump manifest version
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/bump_manifest.py

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@86c87cfdd87dd582eb8b8f226cfec4e09d825326
        with:
          title: "chore(tsar): review upstream standards changes"
          body: |
            Upstream source fingerprints changed.

            This PR does not automatically rewrite TSAR rule content. Review upstream
            material, update affected rules manually, run the complete verification
            suite, and only then merge.
          branch: auto/tsar-sync
          commit-message: "chore(tsar): record upstream standards fingerprints"
          add-paths: |
            .tsar-cache/*.sha256
            manifest.yaml
          delete-branch: true
