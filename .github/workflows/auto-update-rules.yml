name: TSAR Auto-Update Rules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync upstream standards
        id: sync
        run: python scripts/sync_standards.py

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Bump manifest version
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/bump_manifest.py

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          title: "chore(tsar): review upstream standards fingerprint changes"
          branch: auto/tsar-sync
          commit-message: "chore(tsar): record upstream standards fingerprint changes"
          delete-branch: true
