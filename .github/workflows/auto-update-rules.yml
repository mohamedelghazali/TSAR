name: TSAR Auto-Update Rules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  # Exercise the sync pipeline whenever its implementation or configuration changes.
  push:
    branches: [main]
    paths:
      - 'scripts/sync_standards.py'
      - '.github/workflows/auto-update-rules.yml'
      - 'tests/test_sync_standards.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync upstream standards
        id: sync
        run: python scripts/sync_standards.py

      - name: Lint rules
        run: python scripts/lint_rules.py

      - name: Bump manifest version
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/bump_manifest.py

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 # v6
        with:
          title: "chore(tsar): review upstream standards fingerprint changes"
          branch: auto/tsar-sync
          commit-message: "chore(tsar): record upstream standards fingerprint changes"
          delete-branch: true
