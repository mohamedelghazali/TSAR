name: Infrastructure Validation

on:
  push:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'
  pull_request:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
      - run: terraform -chdir=examples/secure/terraform fmt -check
      - run: terraform -chdir=examples/secure/terraform init -backend=false
      - run: terraform -chdir=examples/secure/terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      # External Secrets Operator CRD is validated by its controller schema, not kubeconform's built-in catalog.\n      - run: kubeconform -strict -ignore-missing-schemas -summary examples/secure/kubernetes/
