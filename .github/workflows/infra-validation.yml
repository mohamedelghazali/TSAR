name: Infrastructure Validation

on:
  push:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'
      - 'schemas/kubernetes/**'
      - 'tests/test_examples_infra.py'
      - '.github/workflows/infra-validation.yml'
  pull_request:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'
      - 'schemas/kubernetes/**'
      - 'tests/test_examples_infra.py'
      - '.github/workflows/infra-validation.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba
        with:
          terraform_version: '1.6.1'
      - name: Format Terraform
        run: |
          terraform -chdir=examples/secure/terraform fmt -recursive
          terraform -chdir=examples/secure/terraform fmt -check
      - name: Upload formatted Terraform source
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469
        with:
          name: terraform-formatted-source
          path: examples/secure/terraform/*.tf
          if-no-files-found: error
      - name: Generate provider lock checksums
        run: |
          terraform -chdir=examples/secure/terraform providers lock \
            -platform=linux_amd64 \
            -platform=darwin_arm64 \
            -platform=windows_amd64
      - name: Initialize with generated lockfile
        run: terraform -chdir=examples/secure/terraform init -backend=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform -chdir=examples/secure/terraform validate
      - name: Upload generated provider lockfile
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469
        with:
          name: terraform-provider-lockfile
          path: examples/secure/terraform/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified kubeconform
        shell: bash
        run: |
          set -euo pipefail
          KC_VER="v0.7.0"
          KC_SHA="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KC_VER/kubeconform-linux-amd64.tar.gz"
          echo "$KC_SHA  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes resources and vendored CRDs
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "file://$GITHUB_WORKSPACE/schemas/kubernetes/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            examples/secure/kubernetes/
