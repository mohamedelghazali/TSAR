name: Infrastructure Validation

on:
  push:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'
      - '.github/workflows/infra-validation.yml'
  pull_request:
    paths:
      - 'examples/secure/terraform/**'
      - 'examples/secure/kubernetes/**'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.6.1'
      - run: terraform -chdir=examples/secure/terraform fmt -check
      - run: terraform -chdir=examples/secure/terraform init -backend=false
      - run: terraform -chdir=examples/secure/terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # ExternalSecret schema is pinned to an immutable CRDs-catalog commit.
      - run: >-
          kubeconform -strict -summary
          -schema-location default
          -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b/{group}/{kind}_{version}.json
          examples/secure/kubernetes/
