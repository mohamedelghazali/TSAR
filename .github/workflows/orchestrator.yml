name: TSAR Orchestrator

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run orchestrator
        run: |
          python tools/tsar-orchestrator/orchestrator.py examples/secure \
            --format json \
            --output orchestrator-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-report
          path: orchestrator-report.json

      - name: Enforce result
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("orchestrator-report.json"))
          if data["summary"]["failed"] > 0:
              print(f"FAIL: {data['summary']['failed']} step(s) failed")
              for s in data["steps"]:
                  if s["exit_code"] != 0 and not s["skipped"]:
                      print(f"  - {s['name']}: exit {s['exit_code']}")
              sys.exit(1)
          print(f"PASS: {data['summary']['passed']} step(s) passed")
          PY
