name: TSAR Orchestrator

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run orchestrator
        run: |
          python tools/tsar-orchestrator/orchestrator.py examples/secure \
            --format json \
            --output orchestrator-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # v4
        with:
          name: orchestrator-report
          path: orchestrator-report.json

      - name: Enforce result
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("orchestrator-report.json"))
          if data["summary"]["failed"] > 0:
              print(f"FAIL: {data['summary']['failed']} step(s) failed")
              for s in data["steps"]:
                  if s["exit_code"] != 0 and not s["skipped"]:
                      print(f"  - {s['name']}: exit {s['exit_code']}")
              sys.exit(1)
          print(f"PASS: {data['summary']['passed']} step(s) passed")
          PY
