name: Email, Endpoint, Identity Rules

on:
  push:
    paths:
      - 'rules/email/**'
      - 'rules/endpoint/**'
      - 'rules/identity-federation/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_email_rules.py tests/test_endpoint_rules.py tests/test_identity_rules.py tests/test_report.py -v
