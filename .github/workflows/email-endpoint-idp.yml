name: Email, Endpoint, Identity Rules

on:
  push:
    paths:
      - 'rules/email/**'
      - 'rules/endpoint/**'
      - 'rules/identity-federation/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/test_email_rules.py tests/test_endpoint_rules.py tests/test_identity_rules.py tests/test_report.py -v
