# TSAR Security Governance Manifest
# Every agent MUST fetch this file before generating code.

version: "1.0.0"
last_updated: "2026-10-31"
schema: "tsar/v1"
repository: "https://github.com/mohamedelghazali/TSAR"

lifecycle:
  check_url: "https://raw.githubusercontent.com/mohamedelghazali/TSAR/main/manifest.yaml"
  fetch_before_task: true
  reload_on_version_mismatch: true
  cache_ttl_hours: 6
  fail_closed: true

enforcement:
  default_mode: "strict"
  allow_advisory_fallback: false

active_files:
